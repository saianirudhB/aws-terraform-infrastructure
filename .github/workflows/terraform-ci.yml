name: Terraform CI

# Gate infrastructure changes behind fmt/validate/plan checks on every PR
# that touches Terraform code, before anything is ever applied.
on:
  pull_request:
    paths:
      - "environments/**"
      - "modules/**"
      - ".github/workflows/terraform-ci.yml"

permissions:
  contents: read
  pull-requests: write # needed by the plan job to comment on the PR
  id-token: write # needed by the plan job for AWS OIDC auth

env:
  TF_VERSION: "1.9.5"

jobs:
  # ---------------------------------------------------------------------------
  # fmt: no AWS access needed. Fails if any .tf file isn't canonically
  # formatted.
  # ---------------------------------------------------------------------------
  fmt:
    name: terraform fmt
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform fmt -check -recursive
        run: terraform fmt -check -recursive -diff

  # ---------------------------------------------------------------------------
  # validate: no AWS access needed. Each module and environment is
  # init'd with -backend=false (so it never touches the real S3 backend)
  # and then validated for internal correctness (types, references, etc).
  # ---------------------------------------------------------------------------
  validate:
    name: terraform validate
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        directory:
          - modules/vpc
          - modules/security-groups
          - modules/ec2
          - modules/iam
          - environments/dev
          - bootstrap
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: terraform init (no backend)
        working-directory: ${{ matrix.directory }}
        run: terraform init -backend=false

      - name: terraform validate
        working-directory: ${{ matrix.directory }}
        run: terraform validate

  # ---------------------------------------------------------------------------
  # plan: requires real AWS credentials via OIDC. Only runs against
  # environments/dev (the only root module with a real backend). Posts the
  # plan output as a PR comment so changes are reviewed before anyone runs
  # `terraform apply` locally/manually.
  #
  # To make this job actually run successfully, configure:
  #   - a repository (or environment) VARIABLE named AWS_ROLE_ARN, pointing
  #     at an IAM role that trusts GitHub's OIDC provider
  #     (token.actions.githubusercontent.com) for this repo, scoped to
  #     read-only / plan-safe permissions
  #   - environments/dev/backend.hcl generated from backend.hcl.example,
  #     committed to a private config store or regenerated in-job from repo
  #     variables (left out of this repo since it is account-specific)
  #
  # Without AWS_ROLE_ARN set, this job will fail at the "configure AWS
  # credentials" step - fmt and validate above are unaffected and will
  # still pass on a fork/PR with no AWS access at all.
  # ---------------------------------------------------------------------------
  plan:
    name: terraform plan (environments/dev)
    runs-on: ubuntu-latest
    needs: [fmt, validate]
    if: ${{ vars.AWS_ROLE_ARN != '' }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-2' }}

      - name: terraform init
        working-directory: environments/dev
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=environments/dev/terraform.tfstate" \
            -backend-config="region=${{ vars.AWS_REGION || 'eu-west-2' }}" \
            -backend-config="dynamodb_table=${{ vars.TF_LOCK_TABLE }}"

      - name: terraform plan
        id: plan
        working-directory: environments/dev
        run: terraform plan -no-color -input=false -out=tfplan.binary
        continue-on-error: true

      - name: terraform show (readable plan output)
        working-directory: environments/dev
        run: terraform show -no-color tfplan.binary > plan.txt

      - name: Post plan as PR comment
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const plan = fs.readFileSync('environments/dev/plan.txt', 'utf8');
            const maxLen = 60000;
            const body = plan.length > maxLen
              ? plan.slice(0, maxLen) + '\n\n... (truncated)'
              : plan;

            const comment = [
              '### Terraform Plan - `environments/dev`',
              '',
              '<details><summary>Show plan</summary>',
              '',
              '```',
              body,
              '```',
              '</details>',
              '',
              `*Workflow run: ${context.runId} | Outcome: ${{ steps.plan.outcome }}*`,
            ].join('\n');

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: comment,
            });

      - name: Fail job if plan failed
        if: steps.plan.outcome == 'failure'
        run: exit 1
